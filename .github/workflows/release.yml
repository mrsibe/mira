name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y nsis libgtk-3-dev libwebkit2gtk-4.1-dev libsecret-1-dev

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run checks
        run: |
          go vet ./...
          go test -race ./...
          bun run check

      - name: Check tag matches app version
        run: |
          bun -e '
            import config from "./mygo.config.ts";
            const expected = `v${config.version}`;
            if (process.env.GITHUB_REF_NAME !== expected) {
              throw new Error(`tag ${process.env.GITHUB_REF_NAME} does not match app version ${expected}`);
            }
          '

      - name: Build signed packages
        env:
          MYGO_UPDATER_PRIVATE_KEY: ${{ secrets.MYGO_UPDATER_PRIVATE_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          bun run build -- \
            -platform windows/amd64,linux/amd64,darwin/amd64,darwin/arm64 \
            -skip-dmg \
            -upload

      - name: Verify signed update manifests
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          assets="$(gh release view "$GITHUB_REF_NAME" --json assets --jq '.assets[].name')"
          for target in windows-amd64 linux-amd64 darwin-amd64 darwin-arm64; do
            grep -qx "update-${target}.json" <<<"$assets"
          done
          grep -qx "mira-setup-${GITHUB_REF_NAME#v}-amd64.exe" <<<"$assets"

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release edit "$GITHUB_REF_NAME" \
            --draft=false \
            --latest \
            --title "Mira ${GITHUB_REF_NAME#v}"
